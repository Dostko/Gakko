<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gakko — Kod Atölyesi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
      <aside class="sidebar">
        <button
    class="brand"
    id="sidebarToggle"
    type="button"
    title="Menüyü aç"
    aria-expanded="false"
  >
    G
  </button>
      <nav>
        <button class="nav-btn active" id="chatButton" type="button" title="Sohbet">
          <span class="nav-icon" aria-hidden="true">
            <svg class="menu-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ff6f9f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(255,111,159,.72));">
              <path d="M4.5 5.5h15a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4.5 3v-3h-1a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/>
              <circle cx="9" cy="11" r=".7" fill="#ff6f9f" stroke="none"/>
              <circle cx="12" cy="11" r=".7" fill="#ff6f9f" stroke="none"/>
              <circle cx="15" cy="11" r=".7" fill="#ff6f9f" stroke="none"/>
            </svg>
          </span>
          <span class="nav-label">Sohbet</span>
        </button>

        <button class="nav-btn" id="historyButton" type="button" title="Geçmiş">
          <span class="nav-icon" aria-hidden="true">
            <svg class="menu-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6fb7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(111,183,255,.72));">
              <path d="M4.2 8.4A8.5 8.5 0 1 1 4 15"/>
              <path d="M4.2 4.8v3.9h3.9"/>
              <path d="M12 7.4v5l3.3 2"/>
            </svg>
          </span>
          <span class="nav-label">Geçmiş</span>
        </button>

        <button class="nav-btn" id="filesButton" type="button" title="Dosyalar">
          <span class="nav-icon" aria-hidden="true">
            <svg class="menu-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#76e65b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(118,230,91,.70));">
              <path d="M3.5 7.2h6l1.6 2h9.4v8.3a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V7.2Z"/>
              <path d="M3.5 9.2h17"/>
            </svg>
          </span>
          <span class="nav-label">Dosyalar</span>
        </button>

        <div class="project-nav">
          <button
            class="nav-btn"
            id="projectButton"
            type="button"
            title="Proje"
            aria-expanded="false"
          >
            <span class="nav-icon" aria-hidden="true">
              <svg class="menu-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ff8a2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(255,138,42,.72));">
                <rect x="9.5" y="3" width="5" height="4" rx="1"/>
                <path d="M12 7v4.2M5.5 15v-2.2h13V15"/>
                <rect x="3.2" y="15" width="4.6" height="4.6" rx="1"/>
                <rect x="9.7" y="15" width="4.6" height="4.6" rx="1"/>
                <rect x="16.2" y="15" width="4.6" height="4.6" rx="1"/>
              </svg>
            </span>
            <span class="nav-label">Proje</span>
          </button>

          <div class="project-menu" id="projectMenu" hidden>
            <button class="project-action" id="newProjectButton" type="button">Yeni Proje Başlat</button>
            <button class="project-action" id="openProjectButton" type="button">Proje Aç</button>

            <div class="active-project" id="activeProject" hidden>
              <span>AKTİF PROJE</span>
              <strong id="activeProjectName">—</strong>
              <small id="activeProjectPath"></small>
              <div class="project-tree" id="projectTree" hidden>
                <div class="project-tree-list" id="projectTreeList" role="tree"></div>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <button class="nav-btn settings" id="settingsButton" type="button" title="Ayarlar">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        <span class="nav-label">Ayarlar</span>
      </button>

      <div class="sidebar-resizer" id="sidebarResizer" aria-hidden="true"></div>
    </aside>

    <main class="workspace">

      <section class="chat-stage" id="chatStage">
        <div class="welcome" id="welcome">
          <div class="orb">G</div>
          <p>GAKKO AI</p>
          <h2>Bugün ne üzerinde çalışıyoruz?</h2>
          <span>Kod, fikir ve proje çalışmaları için sade bir sohbet alanı.</span>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <section class="composer-area">
        <form class="composer" id="chatForm">
          <button type="button" class="attach" title="Dosya ekle">＋</button>
          <textarea id="messageInput" rows="2" placeholder="Gakko'ya mesaj yaz..."></textarea>
          <button type="submit" class="send" id="sendButton" title="Gönder">↑</button>
        </form>
        <div class="note" id="statusNote">Dostko AI</div>
      </section>
    </main>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
