<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gakko — Kod Atölyesi</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .history-view {
      height: 100%;
      min-height: 0;
      padding: 28px;
      overflow: hidden;
      color: #eef4fb;
      background: #080b11;
      box-sizing: border-box;
    }
    .history-shell {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 16px;
    }
    .history-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }
    .history-header h2 { margin: 0; font-size: 24px; font-weight: 650; }
    .history-header span { color: #8492a6; font-size: 12px; }
    .history-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }
    .history-search,
    .history-date {
      min-height: 38px;
      border: 1px solid #253142;
      border-radius: 10px;
      background: #0d121b;
      color: #f3f6fa;
      padding: 0 12px;
      outline: none;
      box-sizing: border-box;
    }
    .history-search:focus,
    .history-date:focus { border-color: #4d91d9; }
    .history-delete-before,
    .history-delete-one {
      min-height: 38px;
      border: 1px solid #4b2d34;
      border-radius: 10px;
      background: #181014;
      color: #ff9eaa;
      padding: 0 14px;
      cursor: pointer;
    }
    .history-delete-before:hover,
    .history-delete-one:hover { background: #26151b; color: #ffffff; }
    .history-content {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 34%) minmax(0, 1fr);
      gap: 14px;
    }
    .history-list,
    .history-detail {
      min-height: 0;
      overflow: auto;
      border: 1px solid #1e2938;
      border-radius: 14px;
      background: #0b1018;
    }
    .history-list { padding: 8px; }
    .history-item {
      width: 100%;
      display: grid;
      gap: 6px;
      border: 0;
      border-bottom: 1px solid #182230;
      border-radius: 9px;
      background: transparent;
      color: #dfe7f0;
      padding: 12px;
      text-align: left;
      cursor: pointer;
    }
    .history-item:hover,
    .history-item.active { background: #101c2a; }
    .history-item strong { font-size: 13px; font-weight: 600; color: #ffffff; }
    .history-item-meta { display: flex; gap: 8px; flex-wrap: wrap; color: #8392a5; font-size: 11px; }
    .history-empty { padding: 24px 14px; color: #7e8b9b; text-align: center; font-size: 13px; }
    .history-detail { padding: 18px; }
    .history-detail-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid #1b2635;
    }
    .history-detail-head h3 { margin: 0 0 6px; color: #ffffff; font-size: 17px; }
    .history-detail-meta { color: #8290a2; font-size: 11px; }
    .history-messages { display: grid; gap: 12px; padding-top: 16px; }
    .history-message {
      max-width: 88%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13px;
      line-height: 1.55;
    }
    .history-message.user { justify-self: end; background: #12304a; color: #ffffff; }
    .history-message.assistant { justify-self: start; background: #111923; color: #dce5ef; }
    .history-message .code-block { margin: 8px 0 0; }
    @media (max-width: 900px) {
      .history-view { padding: 18px; }
      .history-toolbar { grid-template-columns: 1fr; }
      .history-content { grid-template-columns: 1fr; grid-template-rows: minmax(180px, 38%) minmax(0, 1fr); }
    }
  </style>
</head>
<body>
    <div class="app-shell">
      <aside class="sidebar">
        <button
    class="brand"
    id="sidebarToggle"
    type="button"
    title="Menüyü aç"
    aria-expanded="false"
  >
    G
  </button>
      <nav>
        <button class="nav-btn active" id="chatButton" type="button" title="Sohbet">
          <span class="nav-icon" aria-hidden="true">
            <svg class="menu-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ff6f9f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(255,111,159,.72));">
              <path d="M4.5 5.5h15a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4.5 3v-3h-1a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/>
              <circle cx="9" cy="11" r=".7" fill="#ff6f9f" stroke="none"/>
              <circle cx="12" cy="11" r=".7" fill="#ff6f9f" stroke="none"/>
              <circle cx="15" cy="11" r=".7" fill="#ff6f9f" stroke="none"/>
            </svg>
          </span>
          <span class="nav-label">Sohbet</span>
        </button>

        <button class="nav-btn" id="historyButton" type="button" title="Geçmiş">
          <span class="nav-icon" aria-hidden="true">
            <svg class="menu-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#6fb7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(111,183,255,.72));">
              <path d="M4.2 8.4A8.5 8.5 0 1 1 4 15"/>
              <path d="M4.2 4.8v3.9h3.9"/>
              <path d="M12 7.4v5l3.3 2"/>
            </svg>
          </span>
          <span class="nav-label">Geçmiş</span>
        </button>

        <div class="project-nav">
          <button
            class="nav-btn"
            id="projectButton"
            type="button"
            title="Proje"
            aria-expanded="false"
          >
            <span class="nav-icon" aria-hidden="true">
              <svg class="menu-icon-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ff8a2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 3px rgba(255,138,42,.72));">
                <rect x="9.5" y="3" width="5" height="4" rx="1"/>
                <path d="M12 7v4.2M5.5 15v-2.2h13V15"/>
                <rect x="3.2" y="15" width="4.6" height="4.6" rx="1"/>
                <rect x="9.7" y="15" width="4.6" height="4.6" rx="1"/>
                <rect x="16.2" y="15" width="4.6" height="4.6" rx="1"/>
              </svg>
            </span>
            <span class="nav-label">Proje</span>
          </button>

          <div class="project-menu" id="projectMenu" hidden>
            <button class="project-action" id="newProjectButton" type="button">Yeni Proje Başlat</button>
            <button class="project-action" id="openProjectButton" type="button">Proje Aç</button>

            <div class="active-project" id="activeProject" hidden>
              <span>AKTİF PROJE</span>
              <strong id="activeProjectName">—</strong>
              <small id="activeProjectPath"></small>
              <div class="project-tree" id="projectTree" hidden>
                <div class="project-tree-list" id="projectTreeList" role="tree"></div>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <button class="nav-btn settings" id="settingsButton" type="button" title="Ayarlar">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        <span class="nav-label">Ayarlar</span>
      </button>

      <div class="sidebar-resizer" id="sidebarResizer" aria-hidden="true"></div>
    </aside>

    <main class="workspace">


      <section class="history-view" id="historyView" hidden>
        <div class="history-shell">
          <div class="history-header">
            <div>
              <h2>Geçmiş</h2>
              <span id="historyRetentionNote">Son 30 günlük sohbet geçmişi</span>
            </div>
          </div>

          <div class="history-toolbar">
            <input class="history-search" id="historySearch" type="search" placeholder="Geçmişte ara...">
            <input class="history-date" id="historyDeleteBefore" type="date" title="Bu tarihten öncekileri sil">
            <button class="history-delete-before" id="historyDeleteBeforeButton" type="button">Bu tarihten öncekileri sil</button>
          </div>

          <div class="history-content">
            <div class="history-list" id="historyList"></div>
            <div class="history-detail" id="historyDetail">
              <div class="history-empty">Okumak için soldan bir sohbet seç.</div>
            </div>
          </div>
        </div>
      </section>

      <section class="chat-stage" id="chatStage">
        <div class="welcome" id="welcome">
          <div class="orb">G</div>
          <p>GAKKO AI</p>
          <h2>Bugün ne üzerinde çalışıyoruz?</h2>
          <span>Kod, fikir ve proje çalışmaları için sade bir sohbet alanı.</span>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <section class="composer-area">
        <form class="composer" id="chatForm">
          <button type="button" class="attach" id="attachButton" title="Dosya veya görsel ekle">＋</button>
          <textarea id="messageInput" rows="2" placeholder="Gakko'ya mesaj yaz..."></textarea>
          <button type="submit" class="send" id="sendButton" title="Gönder">↑</button>
        </form>
        <div class="note" id="statusNote">Gakko AI</div>
      </section>
    </main>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
